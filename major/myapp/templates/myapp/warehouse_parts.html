{% extends 'myapp/home.html' %}

{% block content %}
<div id="warehouse-container">
    {% include 'myapp/partials/warehouse_content.html' %}
</div>

<script>
function filterPartsTable() {
    var input = document.getElementById("partSearchInput");
    if (!input) return;
    var filter = input.value.toLowerCase().trim();
    var table = document.getElementById("partsTable");
    if (!table) return;

    var tbody = table.getElementsByTagName("tbody")[0];
    var rows = tbody.getElementsByTagName("tr");

    for (var i = 0; i < rows.length; i++) {
        if (rows[i].id === "emptyRow") continue;
        var rowText = rows[i].innerText.toLowerCase();
        rows[i].style.display = rowText.indexOf(filter) > -1 ? "" : "none";
    }
}

function openEditModalFromBtn(btn) {
    var d = btn.dataset;
    var form = document.getElementById('editPartForm');
    if (!form) return;

    form.action = '/warehouse-parts/edit/' + d.id + '/';

    document.getElementById('edit_part_name').value = d.name || '';
    document.getElementById('edit_part_number').value = d.number || '';
    document.getElementById('edit_model').value = d.model || '';
    document.getElementById('edit_supplier').value = d.supplier || '';
    document.getElementById('edit_location').value = d.location || '';
    document.getElementById('edit_compatibility_asset').value = d.asset || '';
    document.getElementById('edit_quantity').value = d.qty || 0;
    document.getElementById('edit_date_received').value = d.date || '';
    document.getElementById('edit_description').value = d.desc || '';

    document.getElementById('editPartModal').showModal();
}

function openDeleteModalFromBtn(btn) {
    var d = btn.dataset;
    var form = document.getElementById('deletePartForm');
    if (!form) return;

    form.action = '/warehouse-parts/delete/' + d.id + '/';

    document.getElementById('deletePartName').innerText = d.name || '';
    document.getElementById('deletePartModal').showModal();
}
</script>
{% endblock %}
